name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend, PostgreSQL and Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://flowops:flowops@127.0.0.1:5432/flowops_ci
      TEST_POSTGRES_URL: postgresql+psycopg://flowops:flowops@127.0.0.1:5432/flowops_ci
      PGCONNECT_TIMEOUT: "5"
      CLASSIFICATION_PROVIDER: local
      LLM_API_KEY: ""
      N8N_WEBHOOK_URL: ""

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowops_ci
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U flowops -d flowops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run non-PostgreSQL backend tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: >-
          python -m pytest -q backend/tests
          --ignore=backend/tests/test_postgres_smoke.py

      - name: Verify PostgreSQL connectivity
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          url = os.environ["TEST_POSTGRES_URL"]
          if url != os.environ["DATABASE_URL"]:
              raise SystemExit("Application and smoke-test database URLs differ")

          engine = create_engine(url, connect_args={"connect_timeout": 5})
          try:
              if engine.dialect.name != "postgresql":
                  raise SystemExit("Smoke tests must use PostgreSQL")
              with engine.connect() as connection:
                  database = connection.scalar(text("SELECT current_database()"))
                  if database != "flowops_ci":
                      raise SystemExit(f"Unexpected test database: {database}")
          finally:
              engine.dispose()
          PY

      - name: Run required PostgreSQL smoke tests
        env:
          REQUIRE_POSTGRES_TESTS: "1"
        run: python -m pytest -q -ra backend/tests/test_postgres_smoke.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend Docker image
        run: >-
          docker build --pull
          --file backend/Dockerfile
          --tag flowops-backend:ci
          .

  web:
    name: Frontend and Express
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.33.4
          run_install: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck libraries, frontend and Express
        run: pnpm run typecheck

      - name: Build frontend for production
        env:
          PORT: "26065"
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/flowops run build

      - name: Build Express proxy
        env:
          NODE_ENV: production
        run: pnpm --filter @workspace/api-server run build
