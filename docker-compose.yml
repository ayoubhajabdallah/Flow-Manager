services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops
    ports:
      - "5432:5432"
    volumes:
      - flowops-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://flowops:flowops@postgres:5432/flowops
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  flowops-postgres: